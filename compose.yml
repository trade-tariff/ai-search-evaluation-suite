services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.http
    env_file:
      - .env
    ports:
      - "127.0.0.1:${CLASSIFY_EVAL_PORT:-8100}:8100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
