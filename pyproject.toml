[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-search-evaluation-worker"
version = "0.1.0"
description = "Backend-driven evaluation worker for Trade Tariff Admin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "openai>=1.12.0",
    "httpx>=0.27",
]

[project.scripts]
eval-worker = "worker.backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
