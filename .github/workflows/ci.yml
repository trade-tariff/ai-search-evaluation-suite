name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: apps/classification-evals/requirements.txt
      # apps/classification-evals/requirements.txt pulls in
      # apps/product/backend/requirements.txt via -r, so this one install
      # covers everything tests/ imports (httpx, openai, fastapi, etc.).
      - run: pip install -r apps/classification-evals/requirements.txt
      - name: Run simulation unit tests
        run: python -m unittest discover -s tests -p 'test_simulator.py' -v
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - run: python -m compileall -q apps

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ai-search-evaluation-suite:test
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,scope=ci-docker,mode=max

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
