name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - run: python -m compileall -q src

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ai-search-evaluation-suite:test
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,scope=ci-docker,mode=max
      - name: Build secondary worker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.http
          load: true
          push: false
          tags: ai-search-evaluation-suite-secondary:test
          cache-from: type=gha,scope=ci-docker-secondary
          cache-to: type=gha,scope=ci-docker-secondary,mode=max
      - name: Check worker image boundaries and existing worker tests
        run: |
          for image in ai-search-evaluation-suite:test ai-search-evaluation-suite-secondary:test; do
            docker run --rm -i --entrypoint python \
              --workdir /app "$image" - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          from worker.app import app, health
          assert os.geteuid() != 0
          assert health()['product_backend_present'] is True
          assert set(app.openapi()['paths']) == {
              '/api/health', '/api/live', '/api/evaluation/runs/{run_id}/start',
          }
          for name in ('anthropic', 'google', 'numpy', 'matplotlib', 'sklearn',
                       'asyncpg', 'psycopg', 'bs4', 'docx'):
              assert importlib.util.find_spec(name) is None, name
          for path in ('/app/apps', '/app/src', '/app/build'):
              assert not Path(path).exists(), path
          print('WORKER_IMAGE_BOUNDARY_OK')
          PY
            docker run --rm --entrypoint sh --workdir /app \
              --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" \
              -e CLASSIFICATION_ALLOW_PROVIDER_CALLS=0 "$image" -c '
                set -eu
                python -m unittest discover -s tests -p "test_backend_*.py"
                python -m unittest discover -s tests -p "test_evaluation_ingress.py"
                python -m unittest discover -s tests -p "test_simulator.py"
              '
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
