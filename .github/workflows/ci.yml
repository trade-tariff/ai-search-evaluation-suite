name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: apps/classification-evals/requirements.txt
      # apps/classification-evals/requirements.txt pulls in
      # apps/product/backend/requirements.txt via -r, so this one install
      # covers everything tests/ imports (httpx, openai, fastapi, etc.).
      - run: pip install -r apps/classification-evals/requirements.txt
      - name: Run simulation unit tests
        run: python -m unittest discover -s tests -p 'test_simulator.py' -v
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - run: python -m compileall -q apps

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ai-search-evaluation-suite:test
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,scope=ci-docker,mode=max
      - name: Build secondary worker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/classification-evals/Dockerfile
          load: true
          push: false
          tags: ai-search-evaluation-suite-secondary:test
          cache-from: type=gha,scope=ci-docker-secondary
          cache-to: type=gha,scope=ci-docker-secondary,mode=max
      - name: Check worker image boundaries and existing worker tests
        run: |
          for image in ai-search-evaluation-suite:test ai-search-evaluation-suite-secondary:test; do
            docker run --rm -i --entrypoint python \
              --workdir /app/apps/classification-evals "$image" - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          from backend.worker_app import app, health
          assert os.geteuid() != 0
          assert health()['product_backend_present'] is True
          assert set(app.openapi()['paths']) == {
              '/api/health', '/api/live', '/api/evaluation/runs/{run_id}/start',
          }
          for name in ('anthropic', 'google', 'numpy', 'matplotlib', 'sklearn',
                       'asyncpg', 'psycopg', 'bs4', 'docx', 'main', 'backend.app',
                       'backend.research_app', 'classification_core.classification',
                       'classification_core.local_db', 'classification_core.qa_loop'):
              assert importlib.util.find_spec(name) is None, name
          assert not Path('/app/apps/classification-evals/scripts').exists()
          assert not Path('/app/apps/product/frontend').exists()
          assert not any(Path('/app/apps/product/data').iterdir())
          print('WORKER_IMAGE_BOUNDARY_OK')
          PY
            docker run --rm --entrypoint sh --workdir /app \
              --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" \
              -e CLASSIFICATION_ALLOW_PROVIDER_CALLS=0 \
              -e PYTHONPATH=/app/tests:/app/apps/product/backend "$image" -c '
                set -eu
                python -m unittest discover -s tests -p "test_classification_core_trade_tariff_backend*.py"
                python -m unittest discover -s tests -p "test_evaluation_ingress.py"
                python -m unittest test_classification_core_qa_loop.SimulateTraderAnswerModelSelectionTest test_classification_core_qa_loop.SimulatorImportBoundaryTest test_classification_core_qa_loop.SessionFactsTest test_classification_core_qa_loop.SimulateTraderAnswerBehaviourTest
              '
          done
      - name: Build extraction tools image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/classification-evals/Dockerfile
          target: extraction-tools
          load: true
          push: false
          tags: ai-search-evaluation-suite-extraction:test
          cache-from: type=gha,scope=ci-docker-extraction
          cache-to: type=gha,scope=ci-docker-extraction,mode=max
      - name: Check extraction tools without running the pipeline
        run: |
          docker run --rm --entrypoint python \
            ai-search-evaluation-suite-extraction:test -c 'import psycopg'
          docker run --rm --entrypoint python \
            --workdir /app/apps/classification-evals \
            -e EXTRACTION_ALLOW_PROVIDER_CALLS=0 -e EXTRACTION_ALLOW_NETWORK=0 \
            -e 'TARIFF_DB_DSN=host=/nonexistent dbname=unused connect_timeout=1' \
            ai-search-evaluation-suite-extraction:test \
            scripts/extraction_pipeline.py status > /tmp/extraction-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('/tmp/extraction-status.json').read_text())
          assert status['status'] == 'ok'
          assert status['gates']['provider_calls_allowed'] is False
          assert status['gates']['external_network_allowed'] is False
          assert status['db_counts']['available'] is False
          PY

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
