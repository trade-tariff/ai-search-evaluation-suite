name: worker-tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q src
