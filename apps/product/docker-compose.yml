name: journey
services:
  journey:
    build:
      context: .
      dockerfile: Dockerfile.journey
    image: ai-fanout-journey:latest
    container_name: journey-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    env_file:
      - .env.journey
    healthcheck:
      test: ["CMD","python","-c","import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8200/api/health', timeout=4).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 25s
    networks:
      - shared
networks:
  shared:
    external: true
    name: classification-evals_default
